<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BYTE//8</title>
    <style>
      :root {
        --bg: #020509;
        --cyan: #70e7ff;
        --green: #91ffb3;
        --red: #ff6178;
        --amber: #ffd46b;
        --muted: #78909e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: #def9ff;
        font:
          14px ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      body {
        background:
          radial-gradient(circle at 50% 45%, #10313e22, transparent 30%),
          #020509;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .screen {
        display: flex;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 22px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
        pointer-events: none;
      }
      .screen.on {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        pointer-events: auto;
      }
      .card {
        width: min(900px, 94vw);
        max-height: 90vh;
        overflow: auto;
        padding: 28px;
        border: 1px solid #70e7ff33;
        border-radius: 16px;
        background: #07111bcc;
        box-shadow:
          0 0 60px #36c9ff12,
          inset 0 0 35px #36c9ff08;
        backdrop-filter: blur(10px);
      }
      .brand {
        font-size: clamp(40px, 9vw, 78px);
        letter-spacing: 0.16em;
        color: var(--cyan);
        text-shadow: 0 0 30px #70e7ff55;
      }
      .sub,
      .muted {
        color: var(--muted);
      }
      .gate {
        text-align: center;
        padding: 50px 25px;
      }
      .langs {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 38px;
      }
      .lang,
      .btn {
        cursor: pointer;
        border: 1px solid #70e7ff33;
        background: #07131d;
        padding: 12px 18px;
        border-radius: 9px;
      }
      .lang:hover,
      .btn:hover {
        border-color: var(--cyan);
        box-shadow: 0 0 20px #70e7ff18;
      }
      #stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 15% 22%, #c7f8ff99, transparent),
          radial-gradient(1px 1px at 78% 18%, #c7f8ff77, transparent),
          radial-gradient(1px 1px at 63% 75%, #c7f8ff66, transparent);
        animation: drift 14s ease-in-out infinite;
      }
      #grid {
        position: absolute;
        inset: 0;
        opacity: 0.3;
        transform: perspective(520px) rotateX(62deg) translateY(35%);
        background:
          linear-gradient(#70e7ff22 1px, transparent 1px),
          linear-gradient(90deg, #70e7ff22 1px, transparent 1px);
        background-size: 42px 42px;
        animation: gridpan 7s linear infinite;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes gridpan {
        to {
          background-position: 42px 42px;
        }
      }
      .hud {
        display: none;
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        justify-content: space-between;
        z-index: 20;
        color: var(--muted);
        font-size: 12px;
      }
      .hud span {
        padding: 7px 10px;
        background: #03080ccc;
        border: 1px solid #70e7ff18;
        border-radius: 7px;
      }
      .progress {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: none;
        gap: 4px;
        padding: 12px 16px;
        z-index: 25;
      }
      .progress.on {
        display: flex;
      }
      .seg {
        flex: 1;
        height: 3px;
        background: #70e7ff22;
        border-radius: 2px;
        transition: background 0.3s ease;
      }
      .seg.done {
        background: var(--cyan);
      }
      #boot {
        text-align: left;
      }
      .terminal {
        background: #02070a;
        border: 1px solid #70e7ff22;
        border-radius: 10px;
        padding: 17px;
        line-height: 1.7;
      }
      .center {
        text-align: center;
      }
      .core-space {
        position: absolute;
        width: min(80vw, 720px);
        height: 70vh;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        perspective: 900px;
        touch-action: none;
        cursor: grab;
        user-select: none;
      }
      .core-space:active {
        cursor: grabbing;
      }
      .core {
        --cube: 190px;
        --half: 95px;
        --node: 20px;
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--cube);
        height: var(--cube);
        transform-style: preserve-3d;
        transform: translate(-50%, -50%) rotateX(-18deg) rotateY(25deg);
        transition: 0.35s;
      }
      .core.dragging {
        transition: none;
      }
      .face {
        position: absolute;
        inset: 0;
        border: 1px solid #70e7ff3d;
        background: #70e7ff04;
      }
      .f1 {
        transform: translateZ(95px);
      }
      .f2 {
        transform: rotateY(180deg) translateZ(95px);
      }
      .f3 {
        transform: rotateY(90deg) translateZ(95px);
      }
      .f4 {
        transform: rotateY(-90deg) translateZ(95px);
      }
      .f5 {
        transform: rotateX(90deg) translateZ(95px);
      }
      .f6 {
        transform: rotateX(-90deg) translateZ(95px);
      }
      .node {
        position: absolute;
        width: var(--node);
        height: var(--node);
        margin: calc(var(--node) / -2);
        border-radius: 50%;
        background: var(--cyan);
        box-shadow:
          0 0 12px var(--cyan),
          0 0 35px #70e7ff44;
        transition:
          background 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.3s ease;
        transform-style: preserve-3d;
      }
      .off {
        background: #18262d;
        box-shadow: none;
        border: 1px solid #40515a;
      }
      .glitch {
        background: var(--red);
        box-shadow: 0 0 20px var(--red);
        animation: g 0.1s infinite alternate;
      }
      @keyframes g {
        to {
          transform: translate(4px, -3px) skewX(8deg);
        }
      }
      .n0 {
        left: 0;
        top: 0;
        transform: translateZ(var(--half));
      }
      .n1 {
        right: 0;
        top: 0;
        transform: translateZ(var(--half));
      }
      .n2 {
        right: 0;
        bottom: 0;
        transform: translateZ(var(--half));
      }
      .n3 {
        left: 0;
        bottom: 0;
        transform: translateZ(var(--half));
      }
      .n4 {
        left: 0;
        top: 0;
        transform: translateZ(calc(var(--half) * -1));
      }
      .n5 {
        right: 0;
        top: 0;
        transform: translateZ(calc(var(--half) * -1));
      }
      .n6 {
        right: 0;
        bottom: 0;
        transform: translateZ(calc(var(--half) * -1));
      }
      .n7 {
        left: 0;
        bottom: 0;
        transform: translateZ(calc(var(--half) * -1));
      }
      .corelabel {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) translateZ(125px);
        font-size: 22px;
        color: #fff;
        letter-spacing: 0.2em;
      }
      .readout {
        position: absolute;
        left: 50%;
        bottom: 9%;
        transform: translateX(-50%);
        text-align: center;
      }
      .big {
        font-size: clamp(38px, 9vw, 86px);
        color: #fff;
        text-shadow: 0 0 30px #70e7ff33;
        font-weight: 800;
      }
      .controls {
        position: absolute;
        bottom: 17px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        width: 92vw;
      }
      .title {
        color: var(--cyan);
        letter-spacing: 0.16em;
        margin-bottom: 18px;
      }
      .value {
        text-align: center;
        font-size: clamp(40px, 9vw, 90px);
        margin: 18px 0;
        font-weight: 800;
      }
      .metric {
        display: flex;
        gap: 25px;
        justify-content: center;
        flex-wrap: wrap;
        color: var(--muted);
      }
      .metric b {
        color: #e8fcff;
      }
      .duck {
        white-space: pre;
        text-align: center;
        color: var(--amber);
        font-size: 20px;
        line-height: 1.05;
        margin: 18px;
      }
      .warn {
        color: var(--red);
      }
      .glitchtext {
        animation: txt 0.12s infinite alternate;
      }
      @keyframes txt {
        to {
          transform: translateX(3px);
          filter: hue-rotate(30deg);
        }
      }
      .bits {
        display: flex;
        justify-content: center;
        gap: 7px;
        flex-wrap: wrap;
        margin: 22px 0;
      }
      .bit {
        width: 54px;
        padding: 9px 3px;
        cursor: pointer;
        border: 1px solid #70e7ff33;
        background: #07131d;
        border-radius: 8px;
      }
      .bit.on {
        border-color: var(--green);
        box-shadow: 0 0 18px #91ffb31c;
      }
      .weight {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      .digit {
        font-size: 24px;
        color: #eaffff;
      }
      .commit {
        padding: 13px 15px;
        margin: 9px 0;
        border-left: 3px solid var(--cyan);
        background: #030a0f;
        border-top: 1px solid #70e7ff18;
        border-right: 1px solid #70e7ff18;
        border-bottom: 1px solid #70e7ff18;
      }
      .sha {
        color: #58727e;
      }
      .msg {
        margin-top: 5px;
      }
      .row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .end {
        text-align: center;
        font-size: clamp(25px, 5vw, 50px);
        line-height: 1.35;
        letter-spacing: 0.08em;
        font-weight: 800;
      }
      @media (max-width: 600px) {
        .core {
          --cube: min(42vw, 150px);
          --half: calc(var(--cube) / 2);
          --node: clamp(14px, 4.7vw, 20px);
          width: var(--cube);
          height: var(--cube);
        }
        .f1 {
          transform: translateZ(var(--half));
        }
        .f2 {
          transform: rotateY(180deg) translateZ(var(--half));
        }
        .f3 {
          transform: rotateY(90deg) translateZ(var(--half));
        }
        .f4 {
          transform: rotateY(-90deg) translateZ(var(--half));
        }
        .f5 {
          transform: rotateX(90deg) translateZ(var(--half));
        }
        .f6 {
          transform: rotateX(-90deg) translateZ(var(--half));
        }
      }
      /* BYTE//8 targeted visual/interaction polish */
      :root {
        --ios-font:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Helvetica Neue", Arial, sans-serif;
      }
      body.rtl {
        direction: rtl;
      }
      body.rtl .card,
      body.rtl .terminal {
        direction: rtl;
        text-align: right;
      }
      body.rtl .terminal .code {
        direction: ltr;
        text-align: left;
        unicode-bidi: plaintext;
      }
      body.rtl .brand {
        letter-spacing: 0.1em;
      }
      body.rtl .metric {
        justify-content: flex-start;
      }
      body.rtl .end {
        direction: rtl;
      }
      body.fa-text,
      .fa-text button,
      .fa-text .btn,
      .fa-text .title,
      .fa-text .center,
      .fa-text .metric,
      .fa-text .terminal {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
        font-optical-sizing: auto;
        text-rendering: optimizeLegibility;
      }
      body.fa-text .title,
      .fa-text .center {
        letter-spacing: 0;
      }
      body.fa-text .btn,
      .fa-text button {
        font-weight: 700;
      }
      body.fa-text .center,
      .fa-text .end {
        line-height: 1.9;
      }
      body.fa-text .code-wall {
        direction: ltr;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body.fa-text .controls {
        direction: rtl;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
      }
      .laptop-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border: 1px solid #70e7ff33;
        border-radius: 5px;
        background: #07131d;
        color: var(--muted);
        font-size: 10px;
        cursor: pointer;
      }
      .mobile-control {
        display: none;
      }
      .touch-hint {
        display: none;
      }
      .character {
        display: block;
        width: min(180px, 42vw);
        height: auto;
        margin: 14px auto;
      }
      .advanced-duck {
        width: min(210px, 48vw);
        height: auto;
        display: block;
        margin: auto;
      }
      .bug-character {
        display: block;
        width: min(220px, 50vw);
        height: auto;
        margin: 8px auto;
      }
      .bug-art {
        display: flex;
        justify-content: center;
        margin: 8px auto 4px;
      }
      .bug-art svg {
        width: min(255px, 54vw);
        height: auto;
        display: block;
        filter: drop-shadow(0 16px 18px #00101f99)
          drop-shadow(0 0 18px #3bdfff22);
      }
      .bug-duo {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2px;
        margin: 4px auto;
      }
      .bug-duo svg {
        width: min(150px, 34vw);
        height: auto;
        display: block;
      }
      .celebrate {
        position: relative;
        overflow: hidden;
      }
      .confetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .confetti i {
        position: absolute;
        width: 7px;
        height: 15px;
        border-radius: 2px;
        animation: fall 2.6s linear infinite;
        opacity: 0.85;
      }
      @keyframes fall {
        0% {
          transform: translateY(-15vh) rotate(0);
        }
        100% {
          transform: translateY(115vh) rotate(540deg);
        }
      }
      @media (max-width: 600px) {
        .card {
          width: calc(100vw - 24px);
          max-height: calc(100vh - 24px);
          padding: 20px 16px;
          border-radius: 18px;
        }
        .screen {
          padding: 12px;
          align-items: flex-start;
          padding-top: 8vh;
        }
        .controls {
          bottom: 10px;
          width: calc(100vw - 18px);
          font-size: 11px;
        }
        .mobile-control {
          display: inline-flex;
        }
        .laptop-control {
          display: none;
        }
        .core-space {
          width: 100vw;
          height: 48vh;
          top: 34%;
        }
        
        .readout {
          bottom: 15%;
        }
        .core {
          width: var(--cube);
          height: var(--cube);
        }
        .node {
          width: var(--node);
          height: var(--node);
        }
        .corelabel {
          font-size: clamp(16px, 5vw, 22px);
        }
        .bits {
          gap: 5px;
        }
        .bit {
          width: clamp(40px, 12vw, 54px);
        }
        .touch-hint {
          display: block;
          text-align: center;
          color: var(--muted);
          font-size: 10px;
          margin-top: 6px;
        }
      }
      .code-sample {
        margin: 14px auto 0;
        max-width: 760px;
        max-height: 220px;
        overflow: auto;
        padding: 14px 16px;
        border: 1px solid #70e7ff44;
        border-radius: 14px;
        background: #020912cc;
        color: #8cff98;
        text-align: left;
        direction: ltr;
        font:
          600 11px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        box-shadow: inset 0 0 24px #00d9ff08;
      }
      /* FINAL CELEBRATION ONLY — leaves all previous screens untouched */
      .final-party {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        background: radial-gradient(
          circle at 50% 35%,
          #122b45 0,
          #07121f 38%,
          #020509 78%
        );
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .final-party::before {
        content: "";
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(circle at 18% 25%, #00e5ff22 0 2px, transparent 3px),
          radial-gradient(circle at 72% 18%, #ff4fcf22 0 2px, transparent 3px),
          radial-gradient(circle at 45% 78%, #8b5cff22 0 2px, transparent 3px);
        background-size:
          130px 130px,
          170px 170px,
          210px 210px;
        animation: partyDrift 12s linear infinite;
      }
      @keyframes partyDrift {
        to {
          transform: translate3d(60px, 40px, 0);
        }
      }
      .party-code {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0.24;
        pointer-events: none;
        font:
          600 12px/1.7 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        color: #70e7ff;
        white-space: pre;
        transform: rotate(-3deg) scale(1.08);
      }
      .party-code span {
        display: inline-block;
        margin-right: 26px;
        animation: codeGlow 3s ease-in-out infinite alternate;
      }
      .party-code span:nth-child(3n) {
        color: #ff4fcf;
      }
      .party-code span:nth-child(4n) {
        color: #8cff98;
      }
      .party-code span:nth-child(5n) {
        color: #ffd46b;
      }
      @keyframes codeGlow {
        to {
          opacity: 0.75;
          text-shadow: 0 0 12px currentColor;
        }
      }
      .party-panel {
        position: relative;
        z-index: 3;
        width: min(760px, 92vw);
        max-height: 82vh;
        overflow: hidden;
        padding: clamp(22px, 4vw, 42px);
        border: 1px solid #70e7ff88;
        border-radius: 28px;
        background: #06111ddd;
        box-shadow:
          0 0 60px #00d9ff18,
          0 24px 90px #0009;
        text-align: center;
        backdrop-filter: blur(12px);
      }
      .party-title {
        font-size: clamp(42px, 9vw, 92px);
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #70e7ff;
        text-shadow: 0 0 22px #70e7ff66;
        margin: 0 0 10px;
      }
      .party-msg {
        font-size: clamp(18px, 3vw, 29px);
        line-height: 1.65;
        color: #def9ff;
        font-weight: 800;
      }
      .party-sub {
        font-size: clamp(14px, 2vw, 19px);
        line-height: 1.7;
        color: #9fb6c2;
        margin-top: 10px;
      }
      .party-snippet {
        margin: 18px auto;
        padding: 14px 18px;
        max-width: 620px;
        text-align: left;
        direction: ltr;
        border: 1px solid #70e7ff44;
        border-radius: 16px;
        background: #020912cc;
        color: #8cff98;
        font:
          600 clamp(11px, 1.6vw, 15px)/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      .party-duck {
        position: absolute;
        z-index: 5;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        width: min(380px, 60vw);
        pointer-events: none;
        filter: drop-shadow(0 14px 28px #0009);
        animation: duckBob 2.2s ease-in-out infinite;
      }
      @keyframes duckBob {
        0%,
        100% {
          transform: translateX(-50%) translateY(0) rotate(0);
        }
        35% {
          transform: translateX(-50%) translateY(-7px) rotate(-1.2deg);
        }
        70% {
          transform: translateX(-50%) translateY(-3px) rotate(1deg);
        }
      }
      .party-close {
        margin-top: 12px;
      }
      .party-burst {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 43%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 30px #fff,
          0 0 80px #70e7ff;
        animation: burst 1.1s ease-out forwards;
      }
      @keyframes burst {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(95);
        }
      }
      .party-confetti {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .party-confetti i {
        position: absolute;
        top: -30px;
        width: 8px;
        height: 18px;
        border-radius: 2px;
        animation: fall 3.8s linear infinite;
      }
      .party-confetti i:nth-child(4n) {
        background: #70e7ff;
      }
      .party-confetti i:nth-child(4n + 1) {
        background: #ff4fcf;
      }
      .party-confetti i:nth-child(4n + 2) {
        background: #8cff98;
      }
      .party-confetti i:nth-child(4n + 3) {
        background: #ffd46b;
      }
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(540deg);
        }
      }
      @media (max-width: 600px) {
        .party-panel {

      function playFx(type = "enter") {
        try {
          const A = window.AudioContext || window.webkitAudioContext;
          if (!A) return;
          const ac = new A(),
            o = ac.createOscillator(),
            g = ac.createGain();
          o.type = type === "celebrate" ? "triangle" : "square";
          o.frequency.value = type === "celebrate" ? 660 : 520;
          g.gain.setValueAtTime(0.0001, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.045, ac.currentTime + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.16);
          o.connect(g);
          g.connect(ac.destination);
          o.start();
          o.stop(ac.currentTime + 0.18);
          setTimeout(() => ac.close(), 250);
        } catch (e) {}
      }

        if (gate.classList.contains("on")) {
          if (e.key.toLowerCase() === "e") {
            lang = "en";
            document.documentElement.lang = "en";
            document.body.dir = "ltr";
            gateSub.textContent = q("sub");
            boot();

          if (e.key.toLowerCase() === "d") {
            lang = "de";

            document.body.dir = "ltr";
            document.body.classList.remove("rtl", "fa-text");
            gateSub.textContent = q("sub");
            boot();
          }
          if (e.key.toLowerCase() === "f") {
            lang = "fa";
            document.documentElement.lang = "fa";
            document.body.dir = "rtl";
            document.body.classList.add("rtl", "fa-text");
            gateSub.textContent = q("sub");
            boot();
          }
        }
        if (main.classList.contains("on")) {
          if (e.key === "ArrowLeft") {
            ry -= 12;
            core();
          } else if (e.key === "ArrowRight") {
            ry += 12;
            core();
          } else if (e.key === "ArrowUp") {
            rx -= 10;
            core();
          } else if (e.key === "ArrowDown") {
            rx += 10;
            core();
          } else if (e.key === "+") {
            zoom = Math.min(1.4, zoom + 0.1);
            core();
          } else if (e.key === "-") {
            zoom = Math.max(0.7, zoom - 0.1);
            core();
          } else if (e.key === "Enter") nextLayer();
        }
      });
      gateSub.textContent = q("sub");
      let dragging = false,
        dragX = 0,
        dragY = 0,
        dragRy = 0,
        dragRx = 0,
        pinchStart = 0,
        pinchZoom = 1,
        activePointers = new Map();
      const coreSpace = document.querySelector(".core-space"),
        coreEl = document.getElementById("core");
      coreSpace.addEventListener("pointerdown", (e) => {
        if (!main.classList.contains("on")) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activePointers.size === 1) {
          dragging = true;
          dragX = e.clientX;
          dragY = e.clientY;
          dragRy = ry;
          dragRx = rx;
          coreEl.classList.add("dragging");
        }
        if (activePointers.size === 2) {
          const p = [...activePointers.values()],
            dx = p[0].x - p[1].x,
            dy = p[0].y - p[1].y;
          pinchStart = Math.hypot(dx, dy);
          pinchZoom = zoom;
          dragging = false;
          coreEl.classList.remove("dragging");
        }
        coreSpace.setPointerCapture?.(e.pointerId);
      });
      coreSpace.addEventListener("pointermove", (e) => {
        if (!main.classList.contains("on")) return;
        if (activePointers.has(e.pointerId))
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activePointers.size >= 2) {
          const p = [...activePointers.values()],
            dx = p[0].x - p[1].x,
            dy = p[0].y - p[1].y,
            d = Math.hypot(dx, dy);
          if (pinchStart) {
            zoom = Math.max(0.65, Math.min(1.65, pinchZoom * (d / pinchStart)));
            core();
          }
        } else if (dragging) {
          ry = dragRy + (e.clientX - dragX) * 0.4;
          rx = dragRx - (e.clientY - dragY) * 0.4;
          core();
        }
      });
      function endDrag(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) pinchStart = 0;
        if (activePointers.size === 0) {
          dragging = false;
          coreEl.classList.remove("dragging");
        }
      }
      coreSpace.addEventListener("pointerup", endDrag);
      coreSpace.addEventListener("pointercancel", endDrag);
